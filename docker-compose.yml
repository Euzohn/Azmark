services:
  # postgres/redis 只在 compose 内部网络可达，不发布任何宿主机端口，
  # 避免与服务器上已有的 PostgreSQL/Redis 冲突。需要从宿主机连接时，
  # 用 `docker compose exec postgres psql -U azmark azmark`。
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: azmark
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-azmark}
      POSTGRES_DB: azmark
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U azmark"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine

  api:
    build: ./backend
    environment:
      # 密码必须是 URL 安全字符（推荐 openssl rand -hex 24），否则 URL 解析会失败。
      DATABASE_URL: postgresql+psycopg://azmark:${POSTGRES_PASSWORD:-azmark}@postgres:5432/azmark
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  postgres_data:
