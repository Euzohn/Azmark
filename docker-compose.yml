services:
  # postgres/redis 只在 compose 内部网络可达，不发布任何宿主机端口，
  # 避免与服务器上已有的 PostgreSQL/Redis 冲突。需要从宿主机连接时，
  # 用 `docker compose exec postgres psql -U azmark azmark`。
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: azmark
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-azmark}
      POSTGRES_DB: azmark
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U azmark"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine

  # 附件对象存储（spec #44），只在内网可达；console 端口也不对外发布。
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-azmark}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-azmark-minio-secret}
    volumes:
      - minio_data:/data

  # 一次性初始化 bucket；重复执行是幂等的。
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-azmark}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-azmark-minio-secret}
      S3_BUCKET: ${S3_BUCKET:-azmark}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"; do sleep 2; done
        mc mb --ignore-existing "local/$$S3_BUCKET"

  api:
    build: ./backend
    environment:
      # 密码必须是 URL 安全字符（推荐 openssl rand -hex 24），否则 URL 解析会失败。
      DATABASE_URL: postgresql+psycopg://azmark:${POSTGRES_PASSWORD:-azmark}@postgres:5432/azmark
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-azmark}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-azmark-minio-secret}
      S3_BUCKET: ${S3_BUCKET:-azmark}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_USE_SSL: ${S3_USE_SSL:-false}
      S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:-path}
      MAX_ATTACHMENT_BYTES: ${MAX_ATTACHMENT_BYTES:-20971520}
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    # 不对外发布端口：仅 web 通过内部网络访问 http://api:8000

  web:
    build:
      context: ./web
      args:
        # Next.js 在服务端把 /api/* 反代到这个内部地址（构建期写入）
        API_INTERNAL_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  postgres_data:
  minio_data:
