services:
  # postgres/redis 只在 compose 内部网络可达，不发布任何宿主机端口，
  # 避免与服务器上已有的 PostgreSQL/Redis 冲突。需要从宿主机连接时，
  # 用 `docker compose exec postgres psql -U azmark azmark`。
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: azmark
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-azmark}
      POSTGRES_DB: azmark
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U azmark"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine

  # 附件对象存储（spec #44），只在内网可达；console 端口也不对外发布。
  # bucket 由 API 在首次上传时自动创建，无需 minio/mc 初始化容器。
  minio:
    # MinIO 开源版已归档；daocloud 等常见镜像源也不再代理该镜像。
    # 默认走 1panel 镜像代理并固定到最后一个开源 RELEASE；可覆盖为可直连的镜像源。
    image: ${MINIO_IMAGE:-docker.1panel.live/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-azmark}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-azmark-minio-secret}
    volumes:
      - minio_data:/data

  api:
    build:
      context: ./backend
      args:
        # 服务器访问官方 PyPI 很慢；默认走国内镜像，可用 .env 覆盖。
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    environment:
      # 密码必须是 URL 安全字符（推荐 openssl rand -hex 24），否则 URL 解析会失败。
      DATABASE_URL: postgresql+psycopg://azmark:${POSTGRES_PASSWORD:-azmark}@postgres:5432/azmark
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-azmark}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-azmark-minio-secret}
      S3_BUCKET: ${S3_BUCKET:-azmark}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_USE_SSL: ${S3_USE_SSL:-false}
      S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:-path}
      MAX_ATTACHMENT_BYTES: ${MAX_ATTACHMENT_BYTES:-20971520}
      # 管理员引导（spec #78）：从 .env 透传，启动时若无活跃管理员则自动建。
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    # 不对外发布端口：仅 web 通过内部网络访问 http://api:8000

  web:
    build:
      context: ./web
      args:
        # Next.js 在服务端把 /api/* 反代到这个内部地址（构建期写入）
        API_INTERNAL_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3000}:3000"

  # 备份用的一次性 MinIO 客户端（spec #97）。不随 `docker compose up` 启动，
  # 只由 scripts/backup.sh / restore.sh 通过 `--profile backup run` 调用。
  # 若服务器拉不到 Docker Hub 的 minio/mc，可用 MINIO_MC_IMAGE 指向可达镜像源。
  mc:
    profiles: ["backup"]
    image: ${MINIO_MC_IMAGE:-minio/mc:RELEASE.2025-04-16T18-13-26Z}
    entrypoint: ["mc"]
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-azmark}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-azmark-minio-secret}
      S3_BUCKET: ${S3_BUCKET:-azmark}
      S3_USE_SSL: ${S3_USE_SSL:-false}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups

volumes:
  postgres_data:
  minio_data:
