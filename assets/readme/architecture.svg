<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">Azmark 部署架构：同源代理，仅 web 对外</title>
  <desc id="archDesc">浏览器只访问 web（端口 3000），web 通过 compose 内部网络把 /api 请求转发到 api，api 再连接 postgres、redis 与 minio。api、postgres、redis、minio 均不发布宿主机端口。</desc>

  <!-- warm paper canvas -->
  <rect width="1200" height="430" rx="24" fill="#F5F1E8" stroke="#E3DDD1" stroke-width="1.5"/>

  <!-- heading -->
  <text x="64" y="58" font-family="Georgia, 'Songti SC', 'Noto Serif SC', serif" font-size="40" font-weight="700" fill="#252822">部署架构</text>
  <text x="64" y="88" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#6B6557">同源代理 · 仅 web 对外 · 内部网络隔离</text>

  <!-- ===== internal network boundary ===== -->
  <rect x="540" y="112" width="600" height="280" rx="18" fill="none" stroke="#C66B4E" stroke-width="1.6" stroke-dasharray="7 7"/>
  <text x="560" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="600" fill="#C66B4E">compose 内部网络</text>

  <!-- ===== browser ===== -->
  <g id="browser">
    <rect x="64" y="208" width="180" height="120" rx="12" fill="#FFFFFF" stroke="#E3DDD1" stroke-width="1.5"/>
    <rect x="64" y="208" width="180" height="28" rx="12" fill="#EFE9DC"/>
    <rect x="64" y="222" width="180" height="14" fill="#EFE9DC"/>
    <circle cx="80" cy="222" r="3.5" fill="#C9BDA6"/>
    <circle cx="94" cy="222" r="3.5" fill="#C9BDA6"/>
    <circle cx="108" cy="222" r="3.5" fill="#C9BDA6"/>
    <text x="154" y="276" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="22" font-weight="600" fill="#252822">浏览器</text>
    <text x="154" y="304" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#6B6557">:3000</text>
  </g>

  <!-- arrow browser -> web -->
  <g stroke="#252822" stroke-width="1.8" fill="none">
    <line x1="248" y1="268" x2="318" y2="268" marker-end="url(#arrow)"/>
  </g>
  <text x="283" y="254" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#6B6557">HTTPS</text>

  <!-- ===== web ===== -->
  <g id="web">
    <rect x="324" y="200" width="200" height="140" rx="12" fill="#FFFFFF" stroke="#E3DDD1" stroke-width="1.5"/>
    <text x="424" y="250" text-anchor="middle" font-family="Georgia, 'Songti SC', 'Noto Serif SC', serif" font-size="30" font-weight="700" fill="#252822">web</text>
    <text x="424" y="278" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#6B6557">Next.js · :3000</text>
    <!-- exposed port badge -->
    <rect x="349" y="296" width="150" height="30" rx="15" fill="#C66B4E"/>
    <text x="424" y="317" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="600" fill="#F5F1E8">唯一对外端口</text>
  </g>

  <!-- arrow web -> api (crosses boundary) -->
  <g stroke="#252822" stroke-width="1.8" fill="none">
    <line x1="528" y1="268" x2="598" y2="268" marker-end="url(#arrow)"/>
  </g>
  <text x="572" y="254" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#6B6557">/api/*</text>

  <!-- ===== api ===== -->
  <g id="api">
    <rect x="604" y="200" width="200" height="140" rx="12" fill="#FFFFFF" stroke="#E3DDD1" stroke-width="1.5"/>
    <text x="704" y="250" text-anchor="middle" font-family="Georgia, 'Songti SC', 'Noto Serif SC', serif" font-size="30" font-weight="700" fill="#252822">api</text>
    <text x="704" y="278" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#6B6557">FastAPI · :8000</text>
    <text x="704" y="304" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#6B6557">user_id 隔离</text>
    <text x="704" y="326" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#6B6557">字段加密</text>
  </g>

  <!-- arrows api -> postgres / redis / minio -->
  <g stroke="#252822" stroke-width="1.6" fill="none">
    <line x1="808" y1="238" x2="874" y2="160" marker-end="url(#arrow)"/>
    <line x1="808" y1="268" x2="874" y2="248" marker-end="url(#arrow)"/>
    <line x1="808" y1="298" x2="874" y2="336" marker-end="url(#arrow)"/>
  </g>

  <!-- ===== postgres ===== -->
  <g id="postgres">
    <rect x="880" y="125" width="244" height="70" rx="10" fill="#FFFFFF" stroke="#E3DDD1" stroke-width="1.5"/>
    <text x="1002" y="155" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20" font-weight="600" fill="#252822">postgres</text>
    <text x="1002" y="179" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#6B6557">PostgreSQL + PostGIS</text>
  </g>

  <!-- ===== redis ===== -->
  <g id="redis">
    <rect x="880" y="213" width="244" height="70" rx="10" fill="#FFFFFF" stroke="#E3DDD1" stroke-width="1.5"/>
    <text x="1002" y="243" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20" font-weight="600" fill="#252822">redis</text>
    <text x="1002" y="267" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#6B6557">缓存 · 队列</text>
  </g>

  <!-- ===== minio ===== -->
  <g id="minio">
    <rect x="880" y="301" width="244" height="70" rx="10" fill="#FFFFFF" stroke="#E3DDD1" stroke-width="1.5"/>
    <text x="1002" y="331" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20" font-weight="600" fill="#252822">minio</text>
    <text x="1002" y="355" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#6B6557">S3 兼容 · 附件二进制</text>
  </g>

  <!-- ===== defs: arrowhead ===== -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#252822"/>
    </marker>
  </defs>

  <!-- security note -->
  <text x="64" y="416" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#6B6557">postgres / redis / minio / api 不发布宿主机端口 — 仅 web 经内部网络访问 api</text>
</svg>
